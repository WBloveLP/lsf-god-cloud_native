#有状态应用对存储进行读写
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sts-testxxx-nginx
  namespace: default
spec:
  selector:
    matchLabels:
      app: sts-testxxx-nginx
  serviceName: "testrwoservice"
  replicas: 1
  template:
    metadata:
      labels:
        app: sts-testxxx-nginx
    spec:
      volumes:
      - name: testrwo
        persistentVolumeClaim:
          claimName: pvc-666
      containers:
      - name: sts-testxxx-nginx
        image: nginx
        ports:
        - containerPort: 80
          name: web
        volumeMounts:
        - name: testrwo
          mountPath: /usr/share/nginx/html
---
apiVersion: v1
kind: Service
metadata:
  name: testrwoservice
  namespace: default
spec:
  selector:
    app: sts-testxxx-nginx
  type: ClusterIP #实际上StatefulSet应该用无头服务
  ports:
  - name: testrwoservice
    protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-666
  namespace: default
  labels:
    app: pvc-666
spec:
  storageClassName: rook-cephfs
  accessModes:
  - ReadWriteMany #要想无状态应用也挂载，这块不能写RWO
  resources:
    requests:
      storage: 10m






















#无状态应用只读挂载有状态应用的pv
---
apiVersion: v1
kind: Pod
metadata:
  name: "testrwxpv"
  namespace: default
  labels:
    app: "testrwxpv"
spec:
  containers:
  - name: testrwxpv
    image: "nginx"
    ports:
    - containerPort:  80
      name:  http
    volumeMounts:
    - name: asdf
      mountPath: /usr/share/nginx/html
  volumes:
    - name: asdf
      persistentVolumeClaim:
         claimName:  pvc-666
         readOnly: true # 只读控制
---
apiVersion: v1
kind: Pod
metadata:
  name: "testrwxpv2"
  namespace: default
  labels:
    app: "testrwxpv2"
spec:
  containers:
  - name: testrwxpv2
    image: "nginx"
    ports:
    - containerPort:  80
      name:  http
    volumeMounts:
    - name: asdf2
      mountPath: /usr/share/nginx/html
  volumes:
    - name: asdf2
      persistentVolumeClaim:
         claimName:  pvc-666
         readOnly: true # 只读控制