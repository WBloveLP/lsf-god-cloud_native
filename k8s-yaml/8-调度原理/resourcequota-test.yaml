apiVersion: v1
kind: ResourceQuota
metadata:
  name: mem-cpu-demo
  namespace: quota-mem-cpu-example
spec:
  hard:
    count/pods: 3

---

apiVersion: v1
kind: Pod
metadata:
  name: quota-mem-cpu-demo-1
  namespace: quota-mem-cpu-example
spec:
  containers:
  - name: nginx
    image: nginx
    resources:
      limits:
        memory: "100Mi"
        cpu: "100m"
      requests:
        memory: "50Mi"
        cpu: "50m"
---

